<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extension Zed</title>
    <script src="/boot.js"></script>
    <style>
      /* First-frame shell. Kept inline so the popup paints at its final size
         before the stylesheet and React bundle arrive. React replaces #root. */
      html,
      body {
        margin: 0;
        width: 400px;
        min-width: 400px;
        background: oklch(0.99 0 0);
      }
      html.dark,
      html.dark body {
        background: oklch(0.15 0.02 269.18);
      }
      #root {
        width: 400px;
      }
      .zed-boot {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: 400px;
        height: 600px;
        padding: 12px;
        overflow: hidden;
        border: 1px solid oklch(0.94 0.01 238.46);
        border-radius: 4px;
        background: oklch(1 0 0);
        color: oklch(0.35 0.02 165.48);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        box-shadow: 0 1px 3px 0 oklch(0.35 0.05 163.02 / 0.04), 0 1px 2px -1px oklch(0.35 0.05 163.02 / 0.04);
      }
      html.dark .zed-boot {
        border-color: oklch(0.95 0.01 238.46 / 15%);
        background: oklch(0.2 0.02 266.02);
        color: oklch(0.95 0.01 238.46);
      }
      .zed-boot-tabs {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
        flex: none;
        height: 36px;
        padding: 2px;
        border-radius: 2px;
        background: oklch(0.9 0.02 240.73 / 0.7);
        color: oklch(0.5 0.03 268.53);
      }
      html.dark .zed-boot-tabs {
        background: oklch(0.3 0.03 271.05 / 0.7);
        color: oklch(0.6 0.03 269.46);
      }
      .zed-boot-tab {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
      }
      .zed-boot-tab[data-active] {
        background: oklch(0.99 0 0);
        color: oklch(0.35 0.02 165.48);
      }
      html.dark .zed-boot-tab[data-active] {
        background: oklch(0.15 0.02 269.18);
        color: oklch(0.95 0.01 238.46);
      }
      .zed-boot-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: none;
        width: 360px;
        margin-top: 8px;
        margin-left: 2px;
        padding: 12px 0 4px;
      }
      html:not([data-boot-tab="misc"]) .zed-boot-body {
        visibility: hidden;
      }
      .zed-boot-section {
        position: relative;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        height: 44px;
        padding: 0 12px 0 48px;
        border: 1px solid oklch(0.94 0.01 238.46 / 0.8);
        border-radius: 4px;
        background: oklch(1 0 0);
      }
      html.dark .zed-boot-section {
        border-color: oklch(0.95 0.01 238.46 / 12%);
        background: oklch(0.2 0.02 266.02);
      }
      .zed-boot-handle {
        position: absolute;
        left: 6px;
        top: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        color: oklch(0.5 0.03 268.53);
      }
      html.dark .zed-boot-handle {
        color: oklch(0.6 0.03 269.46);
      }
      .zed-boot-title {
        flex: 1;
        font-size: 16px;
        font-weight: 600;
        line-height: 20px;
      }
      .zed-boot-chevron {
        flex: none;
        width: 16px;
        height: 16px;
        color: oklch(0.5 0.03 268.53);
      }
      html.dark .zed-boot-chevron {
        color: oklch(0.6 0.03 269.46);
      }
    </style>
  </head>
