<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Extension Zed - Browser power tools, YouTube optimizations, playback controls, and extension management." />
    <title>Extension Zed</title>
    <link rel="icon" type="image/svg+xml" href="/images/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <script src="/boot.js"></script>
    <style>
      /* First-frame shell. Kept inline so the popup paints at its final size
         before the stylesheet and React bundle arrive. React replaces #root. */
      html,
      body {
        margin: 0;
        width: 480px;
        min-width: 480px;
        background: oklch(0.99 0 0);
        user-select: none;
        -webkit-user-select: none;
      }
      html.dark,
      html.dark body {
        background: oklch(0.15 0.02 269.18);
      }
      #root {
        width: 480px;
        user-select: none;
        -webkit-user-select: none;
      }
      .zed-boot {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: 480px;
        height: 600px;
        padding: 0;
        overflow: hidden;
        border: 1px solid oklch(0.94 0.01 238.46);
        border-radius: 4px;
        background: oklch(1 0 0);
        color: oklch(0.35 0.02 165.48);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        box-shadow: 0 1px 3px 0 oklch(0.35 0.05 163.02 / 0.04), 0 1px 2px -1px oklch(0.35 0.05 163.02 / 0.04);
        user-select: none;
        -webkit-user-select: none;
      }
      html.dark .zed-boot {
        border-color: oklch(0.95 0.01 238.46 / 15%);
        background: oklch(0.2 0.02 266.02);
        color: oklch(0.95 0.01 238.46);
      }
      .zed-boot-tabs {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 2px;
        flex: none;
        height: 36px;
        overflow-x: auto;
        margin-inline: 0;
        padding: 2px 6px;
        border-radius: 8px;
        background: oklch(0.9 0.02 240.73 / 0.7);
        color: oklch(0.5 0.03 268.53);
        scrollbar-width: thin;
        scrollbar-color: oklch(0.5 0.03 268.53 / 0.4) transparent;
      }
      html.dark .zed-boot-tabs {
        background: oklch(0.3 0.03 271.05 / 0.7);
        color: oklch(0.6 0.03 269.46);
        scrollbar-color: oklch(0.6 0.03 269.46 / 0.4) transparent;
      }
      .zed-boot-tab {
        position: relative;
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
      }
      .zed-boot-tab[data-active] {
        background: oklch(0.99 0 0);
        color: oklch(0.35 0.02 165.48);
      }
      html.dark .zed-boot-tab[data-active] {
        background: oklch(0.15 0.02 269.18);
        color: oklch(0.95 0.01 238.46);
      }
      .zed-boot-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: none;
        width: 100%;
        margin-top: 8px;
        margin-left: 0;
        padding: 0;
      }
      html:not([data-boot-tab="misc"]) .zed-boot-body {
        visibility: hidden;
      }
      .zed-boot-section {
        position: relative;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        height: 44px;
        padding: 0 12px 0 48px;
        border: 1px solid oklch(0.94 0.01 238.46 / 0.8);
        border-radius: 4px;
        background: oklch(1 0 0);
      }
      html.dark .zed-boot-section {
        border-color: oklch(0.95 0.01 238.46 / 12%);
        background: oklch(0.2 0.02 266.02);
      }
      .zed-boot-handle {
        position: absolute;
        left: 6px;
        top: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        color: oklch(0.5 0.03 268.53);
      }
      html.dark .zed-boot-handle {
        color: oklch(0.6 0.03 269.46);
      }
      .zed-boot-title {
        flex: 1;
        font-size: 16px;
        font-weight: 600;
        line-height: 20px;
      }
      .zed-boot-chevron {
        flex: none;
        width: 16px;
        height: 16px;
        color: oklch(0.5 0.03 268.53);
      }
      html.dark .zed-boot-chevron {
        color: oklch(0.6 0.03 269.46);
      }
    </style>
  </head>
  <body>
    <main id="root">
      <div class="zed-boot" aria-hidden="true">
        <div class="zed-boot-tabs" role="presentation">
          <div class="zed-boot-tab" data-boot-tab="misc">Misc</div>
          <div class="zed-boot-tab" data-boot-tab="extensions">Extensions</div>
          <div class="zed-boot-tab" data-boot-tab="youtube">Youtube</div>
          <div class="zed-boot-tab" data-boot-tab="settings" style="margin-left:auto">⚙</div>
        </div>
        <div class="zed-boot-body zed-boot-sections">
          <div class="zed-boot-section" data-boot-section="password">
            <div class="zed-boot-handle">⋮⋮</div>
            <div class="zed-boot-title">Password generator</div>
            <div class="zed-boot-chevron">▼</div>
          </div>
          <div class="zed-boot-section" data-boot-section="playback">
            <div class="zed-boot-handle">⋮⋮</div>
            <div class="zed-boot-title">Playback speed</div>
            <div class="zed-boot-chevron">▼</div>
          </div>
          <div class="zed-boot-section" data-boot-section="volume">
            <div class="zed-boot-handle">⋮⋮</div>
            <div class="zed-boot-title">Volume boost</div>
            <div class="zed-boot-chevron">▼</div>
          </div>
          <div class="zed-boot-section" data-boot-section="quality">
            <div class="zed-boot-handle">⋮⋮</div>
            <div class="zed-boot-title">Video quality</div>
            <div class="zed-boot-chevron">▼</div>
          </div>
          <div class="zed-boot-section" data-boot-section="scrollbars">
            <div class="zed-boot-handle">⋮⋮</div>
            <div class="zed-boot-title">Scrollbars</div>
            <div class="zed-boot-chevron">▼</div>
          </div>
          <div class="zed-boot-section" data-boot-section="modes">
            <div class="zed-boot-handle">⋮⋮</div>
            <div class="zed-boot-title">Modes</div>
            <div class="zed-boot-chevron">▼</div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
